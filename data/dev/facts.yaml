  # Incident response
  - id: irp-plan
    doc: irp
    control: ir-plan
    stance: yes
    text: "Kestrelyn maintains a documented incident response plan."
  - id: irp-tabletop
    doc: irp
    control: ir-tabletop
    stance: yes
    text: "An incident response tabletop exercise is held annually."
