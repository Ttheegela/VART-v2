# Dev fact sheet: the single source of truth for the fictional company Kestrelyn.
#   documents   what a visitor uploads (rendered from data/dev/src by datakit.render)
#   controls    what is true, one per questionnaire topic
#   statements  every sentence that speaks to a control, with the stance it supports (yes / no / partial)
#   traps       every planted difficulty and the statements or controls it is made of
# A statement text appears verbatim in its document. Record statements (arr, ainv) are the whole spreadsheet row
# exactly as app.text.record_line renders it, with these column headers:
#   arr:  System, Owner, Last review completed, Next review due, Status
#   ainv: Asset, Type, Location, Owner, Data, Added
# ASCII only. Bare yes/no stay strings (datakit.schemas.load_yaml reads only true/false as booleans).
pack: dev

company:
  name: Kestrelyn
  legal_name: "Kestrelyn, Inc."
  domain: kestrelyn.example
  product: Kestrelyn Ledger
  employees: 85
  hosting: AWS us-east-1

buyer: Northbeam Health

people:
  - {name: Dana Ortiz, role: Head of Security, email: dana.ortiz@kestrelyn.example}
  - {name: Priya Raman, role: CTO, email: priya.raman@kestrelyn.example}
  - {name: Marcus Lee, role: IT Manager, email: marcus.lee@kestrelyn.example}
  - {name: Elena Novak, role: HR Director, email: elena.novak@kestrelyn.example}
  - {name: Sam Whitfield, role: CEO, email: sam.whitfield@kestrelyn.example}

