traps:
  # date: a newer record contradicts an older document
  - id: D1
    kind: date
    statements: [acp-access-review, arr-okta, arr-aws, arr-github, arr-gws, arr-ledger-admin]
    note: "The policy says user access is reviewed quarterly; the newer review log shows every system overdue since the January 2026 review."
  - id: D2
    kind: date
    statements: [soc2-cloud-only, ainv-office-fs01]
    note: "The SOC 2 summary says there is no on-premises infrastructure; the newer asset inventory lists an on-premises office file server added in August 2026."
  # disagree: two documents that cover the same ground say different things
  - id: X1
    kind: disagree
    statements: [bcpol-restore-test, bcp-restore-test]
    note: "The continuity policy says backup restores are tested quarterly; the DR plan says annually."
  - id: X2
    kind: disagree
    statements: [lmp-retention, soc2-retention]
    note: "The logging policy says security logs are kept for one year; the SOC 2 summary says 90 days."
  # scope: both are true, for different parts of the company
  - id: S1
    kind: scope
    statements: [acp-mfa, pentest-mfa]
    note: "MFA is required for internal systems (access policy) but not yet for customer administrator accounts (pentest report): partial, and the answer should say which scope is which."
  - id: S2
    kind: scope
    statements: [hrp-background-checks, vrm-background-checks]
    note: "Employees are background checked (HR policy) but contractors only attest (vendor policy): partial, and the answer should say which scope is which."
  # negation: the sentence names the topic but denies it
  - id: N1
    kind: negation
    statements: [pentest-mfa]
    note: "A not-yet-enforced sentence about MFA; it must not be read as support for Yes."
  - id: N2
    kind: negation
    statements: [soc2-bug-bounty, faq-bug-bounty]
    note: "A bug bounty is not operated today and only planned for 2027; neither sentence supports Yes."
  - id: N3
    kind: negation
    statements: [sdp-dast, faq-dast]
    note: "DAST is not yet performed and only planned for the first quarter of 2027; neither sentence supports Yes."
  # honest_negative: the true answer is No, and No is a verified answer
  - id: H1
    kind: honest_negative
    statements: [isp-iso27001]
    note: "Kestrelyn is not ISO/IEC 27001 certified; the correct answer is a verified No."
  - id: H2
    kind: honest_negative
    statements: [dcp-ml-training]
    note: "Customer data is never used to train models; the correct answer is a verified No to a question about using it."
  - id: H3
    kind: honest_negative
    statements: [soc2-bug-bounty, faq-bug-bounty]
    note: "There is no bug bounty program; the correct answer is a verified No."
  - id: H4
    kind: honest_negative
    statements: [sdp-dast, faq-dast]
    note: "DAST is not performed; the correct answer is a verified No."
  - id: H5
    kind: honest_negative
    statements: [vmp-customer-pentest]
    note: "Customers may not run their own penetration tests; the correct answer is a verified No."
  # placeholder: a sentence with unfilled [brackets] is not evidence
  - id: P1
    kind: placeholder
    statements: [tmpl-pentest]
    note: "The policy template still has [Company Name] and [frequency]; it is also a template, which is not evidence."
  - id: P2
    kind: placeholder
    statements: [vmp-policy-review]
    note: "The vulnerability policy sentence about its own review still has [Company Name] and [frequency]."
  # draft_only: the only evidence is in a draft
  - id: R1
    kind: draft_only
    statements: [hb-laptop-encryption]
    note: "Full-disk encryption is required only in the draft employee handbook: at most partial."
  - id: R2
    kind: draft_only
    statements: [irp-plan]
