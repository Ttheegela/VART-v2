# Questionnaire A: the source of vsq-a.xlsx (python -m datakit.questionnaires).
# Each question is reworded from `source` (a VSAQ item, or an MVSP control where VSAQ has nothing close; for topics
# neither covers, the nearest item). `control` is the fact-sheet control the question is answered from.
# Every control appears at least once; mfa, access-review and backup-restore-test are asked twice in different words.
# Questions about the conflict-trap controls carry the threshold the documents disagree on.
questionnaire: vsq-a
title: Vendor Security Questionnaire (VSQ-A)
buyer: Northbeam Health
items:
