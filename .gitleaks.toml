[extend]
useDefault = true

# Why: the generic-api-key rule matches GOLDEN_KEY and GOLDEN_KEY_NON_ASCII by name; the value is a sha256 record/replay key, not a credential.
[[allowlists]]
description = "GOLDEN_KEY and GOLDEN_KEY_NON_ASCII (tests/test_llm_client.py, and the Plan 2a draft that appends the second) are the sha256 of a canonical LLM request (the record/replay key), not a credential"
condition = "AND"
paths = ['''^(?:tests/test_llm_client\.py|docs/superpowers/plans/2026-10-04-vart-v2-plan2a-engine\.md)$''']
regexTarget = "line"
regexes = ['''^\s*GOLDEN_KEY(?:_NON_ASCII)? = "[0-9a-f]{64}"\s*$''']

# Why: the Plan 2b draft's redaction test uses a fake PEM block, and the private-key rule's match runs on to an END marker inside the redaction regex ~90 lines later; not a key.
[[allowlists]]
description = "Fake PEM test input in the Plan 2b draft, not a key; scoped to that one file and to the private-key rule only"
targetRules = ["private-key"]
paths = ['''^docs/superpowers/plans/2026-10-04-vart-v2-plan2b-ingest\.md$''']

# Why: every recording row (evals/recorded and web/e2e/recorded.jsonl) is written with sort_keys, so it reads `"key": "<64 hex>"`, and generic-api-key matches
# that by name; the value is the sha256 record/replay key of a canonical LLM request, not a credential.
[[allowlists]]
description = "Record/replay keys (64-hex sha256) in evals/recorded/*.jsonl and web/e2e/recorded.jsonl; scoped to those paths, generic-api-key and a 64-hex secret only, so a real key inside recorded prompt text is still caught"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^(?:evals/recorded/[^/]+|web/e2e/recorded)\.jsonl$''']
regexes = ['''^[0-9a-f]{64}$''']

# Why: the redaction tests feed fake keyed secrets ("API_KEY_PROD=abcdefgh12345678") and a cautious-side case
# ("Token: RS256-signed") through the redactor; neither value is a credential.
[[allowlists]]
description = "Fake secret bodies in tests/test_redact.py; scoped to that file, generic-api-key and the two literal fake values"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_redact\.py$''']
regexes = ['''^(?:abcdefgh12345678|RS256-signed)$''']

# Why: the ingest store test passes the file name "iso27001-policy.md" after a "access-control-policy.md" literal, and
# generic-api-key reads the pair as a keyed value; it is a file name.
[[allowlists]]
description = "A file name in tests/test_ingest_store.py; scoped to that file, generic-api-key and that one literal"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/test_ingest_store\.py$''']
regexes = ['''^iso27001-policy\.md$''']

# Why: the redaction tests build file names around fake provider keys (a Stripe key, an AWS key id, a GitLab token, a
# JWT) to prove redact_filename removes them; every value is an invented literal, not a credential.
[[allowlists]]
description = "Fake provider keys in tests/test_redact.py; scoped to that file, the four matching rules and the exact fake values"
condition = "AND"
targetRules = ["stripe-access-token", "aws-access-token", "gitlab-pat", "jwt"]
paths = ['''^tests/test_redact\.py$''']
regexes = ['''^(?:sk_live_abcdef1234567890XYZ|AKIAABCDEFGHIJKLMNOP|glpat-abcdefghij1234567890|eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV)$''']
