# Vercel's Python builder reads [project]; keep dependencies in sync with requirements.txt.
[project]
name = "vart"
version = "2.0.0.dev0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "openai>=3,<4",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "python-multipart>=0.0.20,<1",
    "langfuse>=4,<5",
    "openpyxl==3.1.5",
    "python-docx>=1.2,<2",
    "pypdfium2>=5.13,<6",
    "presidio-analyzer==2.2.364",
    "spacy==3.8.16",
    "thinc==8.3.13",
    # spaCy small English model; 3.8.0 is the release for spaCy 3.8.x
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions", "docs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "openpyxl", "openpyxl.*", "docx", "docx.*", "pypdfium2", "pypdfium2.*", "fpdf", "fpdf.*",
    "presidio_analyzer", "presidio_analyzer.*", "spacy", "spacy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost,::1"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# UI is served from Vercel's CDN (built into public/), not bundled into the function.
[tool.vercel.fastapi.static]
exclude = true
# The trace-flush ASGI middleware would otherwise keep the frontend inside the function,
# where `exclude` removes it; promote static files to the CDN regardless (PriorPath incident 2026-10-02).
cdn = true
