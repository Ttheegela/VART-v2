name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vart
          POSTGRES_PASSWORD: vart
          POSTGRES_DB: vart_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U vart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vart:vart@localhost:5434/vart_test
      DATABASE_URL: postgresql+psycopg://vart:vart@localhost:5434/vart_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts datakit
      - run: pytest -q
      - run: alembic check
      - run: python scripts/export_openapi.py && git diff --exit-code openapi.json
      - run: python -m datakit.validate all
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run gen:api && git diff --exit-code src/lib/api-types.ts
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sponsor_check.sh scans the whole history (git log --all -p)
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: bash scripts/sponsor_check.sh
        env:
          # A repository secret, not a variable: a variable prints unmasked in public run logs.
          SPONSOR_NAME: ${{ secrets.SPONSOR_NAME }}
      - run: python scripts/check_monochrome.py
      - uses: gitleaks/gitleaks-action@v3 # v2 runs on Node 20, which GitHub is removing from hosted runners
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vart
          POSTGRES_PASSWORD: vart
          POSTGRES_DB: vart_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U vart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vart:vart@localhost:5434/vart_test
      SESSION_SECRET: ci-session-secret
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
