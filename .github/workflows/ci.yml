name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vart
          POSTGRES_PASSWORD: vart
          POSTGRES_DB: vart_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U vart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vart:vart@localhost:5434/vart_test
      DATABASE_URL: postgresql+psycopg://vart:vart@localhost:5434/vart_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts datakit evals
      - run: pytest -q
      - run: pytest -q tests/test_decide.py tests/test_decide_properties.py --cov=app.decide --cov-branch --cov-fail-under=100
      - run: python -m evals.run --pack dev
      - run: python -m evals.run --pack gap-dev
      - run: git diff --exit-code evals/results
      - run: alembic check
      - run: python scripts/export_openapi.py && git diff --exit-code openapi.json
      - run: python -m datakit.validate all
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run gen:api && git diff --exit-code src/lib/api-types.ts
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the sponsor check and gitleaks both scan the whole history
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: bash scripts/sponsor_check.sh
        env:
          # A repository secret, not a variable: a variable prints unmasked in public run logs.
          SPONSOR_NAME: ${{ secrets.SPONSOR_NAME }}
      - run: python scripts/check_monochrome.py
      # The gitleaks CLI, not gitleaks-action: the action scans only the `--no-merges --first-parent` range of a push
      # (upstream issues #236, #163, #199), which skips what a merge brings in or fails on some merge pushes.
      # The CLI scans every commit on every ref, on every run. No token and no network use beyond the download.
      - name: gitleaks over the whole history
        run: |
          set -euo pipefail
          # Pinned release. The sha256 is the linux_x64 line of the release's gitleaks_8.30.1_checksums.txt (GitHub's
          # digest for the asset is the same). Bump both together.
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          if [ "$(git rev-parse --is-shallow-repository)" != false ]; then
            echo "shallow clone: the checkout needs fetch-depth: 0" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # Exit 1 on any finding; --redact keeps secret values out of this public log.
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner .
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vart
          POSTGRES_PASSWORD: vart
          POSTGRES_DB: vart_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U vart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vart:vart@localhost:5434/vart_test
      SESSION_SECRET: ci-session-secret
      CRON_SECRET: ci-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: web/test-results
